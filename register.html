<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Room Reservation</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body class="auth-page">
<div aria-hidden="true" class="auth-bg">
<span class="orb orb-1"></span>
<span class="orb orb-2"></span>
<span class="orb orb-3"></span>
<span class="orb orb-4"></span>
</div>
<div class="container small-container">
<a class="auth-brand" href="index.html">
<span class="auth-logo">📚</span>
<span class="auth-wordmark">Room Reservation</span>
</a>
<div id="alertBox"></div>
<div class="tilt-wrap">
<div class="box auth-card" id="authCard">
<div class="auth-card-head">
<span class="auth-eyebrow">Get started</span>
<h2>Create your account</h2>
<p class="auth-sub">
                    Sign up to start reserving school rooms.
                </p>
</div>
<form id="registerForm">
<label>Full Name</label>
<input id="name" placeholder="Juan Dela Cruz" required="" type="text"/>
<p class="field-hint" id="nameHint" style="display:none;"></p>
<label>Email</label>
<input id="email" placeholder="you@school.com" required="" type="email"/>
<label>Role</label>
<select id="role">
<option value="student">
                        Student Leader
                    </option>
<option value="teacher">
                        Teacher
                    </option>
<option value="staff">
                        School Staff
                    </option>
</select>
<label>Password</label>
<div class="password-field">
<input id="password" placeholder="At least 6 characters" required="" type="password"/>
<button aria-label="Show password" class="password-toggle" onclick="togglePasswordVisibility(this, 'password')" type="button">👁️</button>
</div>
<label>Confirm Password</label>
<div class="password-field">
<input id="confirm" placeholder="Confirm password" required="" type="password"/>
<button aria-label="Show password" class="password-toggle" onclick="togglePasswordVisibility(this, 'confirm')" type="button">👁️</button>
</div>
<label>Identity Photo (Verification)</label>
<div class="photo-capture" id="photoCapture">
<div class="photo-frame">
<div class="photo-placeholder" id="photoPlaceholder">
<span>📷</span>
</div>
<video autoplay="" id="camPreview" muted="" playsinline="" style="display:none;"></video>
<canvas id="camCanvas" style="display:none;"></canvas>
<img alt="Captured verification photo" id="photoPreview" style="display:none;"/>
</div>
<p class="photo-status" id="photoStatus">
                        Take a quick photo or upload one so admins
                        can confirm your account belongs to a real person.
                    </p>
<div class="photo-actions">
<button class="btn" id="startCamBtn" onclick="startCamera()" type="button">
                            📷 Use Camera
                        </button>
<label class="btn photo-upload-label" for="photoUpload">
                            📁 Upload Photo
                        </label>
<input accept="image/*" id="photoUpload" style="display:none;" type="file"/>
<button class="btn success" id="captureBtn" onclick="capturePhoto()" style="display:none;" type="button">
                            ✅ Capture
                        </button>
<button class="btn" id="retakeBtn" onclick="retakePhoto()" style="display:none;" type="button">
                            🔄 Retake
                        </button>
</div>
</div>
<button class="btn success full-width" disabled="" id="submitBtn" type="submit">
                    Create Account
                </button>
</form>
<div class="auth-divider"></div>
<p class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
</p>
<div class="glare"></div>
</div>
</div>
</div>
<script src="auth.js"></script>

<script onerror="window.faceApiScriptFailed = true;" src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>

if (getSession()) {
    window.location.href = "dashboard.html";
}

// ------------------------------------------------------------
// Face-check model loading (best-effort, with a graceful offline
// fallback). If this never becomes ready, photo capture still
// works — it's just marked unverified for the admin to eyeball.
// ------------------------------------------------------------

let faceApiReady = false;

async function initFaceApi() {

    if (window.faceApiScriptFailed || typeof faceapi === "undefined") {
        return;
    }

    try {

        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

        await Promise.race([
            Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]),
            new Promise((_, reject) =>
                setTimeout(() => reject(new Error("timeout")), 10000)
            )
        ]);

        faceApiReady = true;

    } catch (e) {
        faceApiReady = false;
    }
}

initFaceApi();

// ------------------------------------------------------------
// Photo capture (camera or file upload)
// ------------------------------------------------------------

let capturedPhoto = null;
let capturedDescriptor = null;
let faceVerifiedFlag = false;
let mediaStream = null;

function setPhotoStatus(msg, type) {
    let el = document.getElementById("photoStatus");
    el.textContent = msg;
    el.className = "photo-status" + (type ? " " + type : "");
}

function updateSubmitState() {
    document.getElementById("submitBtn").disabled = !capturedPhoto;
}

async function startCamera() {

    try {

        mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
        });

        let video = document.getElementById("camPreview");
        video.srcObject = mediaStream;
        video.style.display = "block";

        document.getElementById("photoPlaceholder").style.display = "none";
        document.getElementById("photoPreview").style.display = "none";
        document.getElementById("startCamBtn").style.display = "none";
        document.getElementById("captureBtn").style.display = "inline-flex";

        setPhotoStatus("Center your face and click Capture.", "");

    } catch (e) {

        setPhotoStatus(
            "⚠️ Camera unavailable or permission denied. You can upload a photo instead.",
            "warn"
        );
    }
}

function stopCamera() {

    if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
    }
}

async function evaluateCapturedFrame(canvas) {

    setPhotoStatus("Checking photo...", "");

    let faceFound = null;
    let descriptor = null;

    if (faceApiReady) {

        try {

            let detection = await faceapi
                .detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();

            faceFound = !!detection;
            descriptor = detection ? Array.from(detection.descriptor) : null;

        } catch (e) {
            faceFound = null;
            descriptor = null;
        }
    }

    if (faceApiReady && faceFound === false) {

        setPhotoStatus(
            "❌ No face detected. Please face the camera clearly and try again.",
            "error"
        );

        return;
    }

    capturedPhoto = canvas.toDataURL("image/jpeg", 0.85);
    capturedDescriptor = descriptor;
    faceVerifiedFlag = faceApiReady && faceFound === true;

    stopCamera();

    document.getElementById("camPreview").style.display = "none";
    document.getElementById("photoPlaceholder").style.display = "none";

    let img = document.getElementById("photoPreview");
    img.src = capturedPhoto;
    img.style.display = "block";

    document.getElementById("captureBtn").style.display = "none";
    document.getElementById("startCamBtn").style.display = "none";
    document.getElementById("retakeBtn").style.display = "inline-flex";

    if (faceVerifiedFlag) {
        setPhotoStatus("✅ Face detected — photo verified.", "ok");
    } else {
        setPhotoStatus(
            "📷 Photo saved. Face-check was unavailable, so an admin will verify it manually.",
            "warn"
        );
    }

    updateSubmitState();
}

async function capturePhoto() {

    let video = document.getElementById("camPreview");
    let canvas = document.getElementById("camCanvas");

    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;

    canvas.getContext("2d").drawImage(
        video, 0, 0, canvas.width, canvas.height
    );

    await evaluateCapturedFrame(canvas);
}

function retakePhoto() {

    capturedPhoto = null;
    capturedDescriptor = null;
    faceVerifiedFlag = false;

    document.getElementById("photoPreview").style.display = "none";
    document.getElementById("retakeBtn").style.display = "none";
    document.getElementById("startCamBtn").style.display = "inline-flex";
    document.getElementById("photoPlaceholder").style.display = "flex";

    setPhotoStatus(
        "Take a quick photo or upload one so admins can confirm your account belongs to a real person.",
        ""
    );

    updateSubmitState();
}

document.getElementById("photoUpload")
    .addEventListener("change", function (e) {

        let file = e.target.files[0];

        if (!file) {
            return;
        }

        let reader = new FileReader();

        reader.onload = function (evt) {

            let img = new Image();

            img.onload = async function () {

                let canvas = document.getElementById("camCanvas");
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.getContext("2d").drawImage(img, 0, 0);

                await evaluateCapturedFrame(canvas);
            };

            img.src = evt.target.result;
        };

        reader.readAsDataURL(file);
    });

// Soft, non-blocking nudge if the entered name/email matches a
// common troll/spam signup pattern. It never blocks submission —
// the real gate is the admin's Manage Users review panel.
function checkSignupHint() {

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let hint = document.getElementById("nameHint");

    if (!name) {
        hint.style.display = "none";
        return;
    }

    let trust = analyzeAccountTrust(
        { name: name, email: email, role: "student" },
        getUsers()
    );

    if (trust.flags.length > 0) {
        hint.textContent =
            "⚠️ " + trust.flags[0] +
            " — please use your real name and school email.";
        hint.style.display = "block";
    } else {
        hint.style.display = "none";
    }
}

document.getElementById("name")
    .addEventListener("input", checkSignupHint);

document.getElementById("email")
    .addEventListener("input", checkSignupHint);

document
.getElementById("registerForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    let name =
        document.getElementById("name").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let role =
        document.getElementById("role").value;

    let password =
        document.getElementById("password").value;

    let confirm =
        document.getElementById("confirm").value;


    if (password !== confirm) {

        showAlert(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    if (password.length < 6) {

        showAlert(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    if (!capturedPhoto) {

        showAlert(
            "Please capture or upload a verification photo.",
            "error"
        );

        return;

    }


    let result =
        registerUser(
            name,
            email,
            password,
            role,
            capturedPhoto,
            faceVerifiedFlag,
            capturedDescriptor
        );


    if (result.success) {

        stopCamera();

        showAlert(
            result.message,
            "success"
        );

        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 2200);

    } else {

        showAlert(
            result.message,
            "error"
        );

    }

});


function showAlert(message, type) {

    document.getElementById("alertBox").innerHTML =
        `<div class="alert ${type}">
            ${message}
        </div>`;

}

</script>
</body>
</html>
