<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Room Reservation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script>if (localStorage.getItem("rr-theme") === "light") document.documentElement.setAttribute("data-theme", "light");</script>
</head>
<body class="auth-page">

    <div class="page-cover" aria-hidden="true"></div>

    <div class="container small-container">
        <div class="auth-toolbar">
            <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle light and dark mode">
                <span class="theme-toggle-thumb">🌙</span>
            </button>
        </div>

        <div id="alertBox"></div>

        <div class="box auth-card">
            <div class="auth-card-hero" role="img" aria-label="CCIS crest">
                <a class="auth-card-hero-link" href="index.html" aria-label="Room Reservation home"></a>
            </div>

            <div class="auth-card-body">
                <div class="auth-card-head tight">
                    <span class="auth-eyebrow">Welcome back</span>
                    <h2>Log in to your account</h2>
                </div>

                <p class="auth-sub auth-sub-center">
                    Reserve a school room in just a few clicks.
                </p>

                <form id="loginForm">
                    <label>Email</label>
                    <input id="email" type="email" placeholder="you@gmail.com" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" title="Enter a valid @gmail.com email" required>

                    <label>Password</label>
                    <div class="password-field">
                        <input id="password" type="password" placeholder="Password" required>
                        <button class="password-toggle" type="button" aria-label="Show password" onclick="togglePasswordVisibility(this, 'password')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>

                    <div class="auth-row-between">
                        <label class="checkbox-field">
                            <input id="rememberMe" type="checkbox" checked>
                            <span class="checkbox-box"></span>
                            <span class="checkbox-label">Remember me</span>
                        </label>

                        <a class="auth-inline-link" href="forgot-password.html">Forgot password?</a>
                    </div>

                    <button class="btn success full-width" type="submit">Log In</button>
                </form>

                <div class="auth-divider"></div>

                <p class="auth-footer">
                    Accounts are created by the school admin.
                    Contact the admin office if you need access.
                </p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script>

        if (getSession()) {
            window.location.href = "dashboard.html";
        }

        // Pre-fill the form if "Remember me" was used last time,
        // so signing back in (including after logging out) is a
        // single click on "Log In".
        let remembered = getRememberedLogin();
        if (remembered) {
            document.getElementById("email").value = remembered.email;
            document.getElementById("password").value = remembered.password;
            document.getElementById("rememberMe").checked = true;
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {

            e.preventDefault();

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let remember = document.getElementById("rememberMe").checked;

            let result = loginUser(email, password, remember);

            if (result.success) {
                window.location.href = "dashboard.html";
            } else {
                showAlert(result.message, "error");
            }
        });

    </script>
</body>
</html>
